name: Research brain
# GoPeak research agents (agents/brain.py). Runs in the cloud, PC can be off.
on:
  schedule:
    - cron: "15 12 * * *"     # daily: collect reference data without Gemini
    - cron: "45 12 * * 1"     # Monday: creator finder without Gemini
  workflow_dispatch:
    inputs:
      agents: { description: "non-AI agents to run: collect, creators", default: "collect" }
concurrency: { group: brain, cancel-in-progress: false }
jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -U yt-dlp
      - name: Agents
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          case "${{ github.event.schedule }}" in
            "15 12 * * *") A="collect" ;;
            "45 12 * * 1") A="creators" ;;
            *) A="${{ inputs.agents }}" ;;
          esac
          python agents/brain.py $A
