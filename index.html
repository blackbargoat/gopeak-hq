<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GoPeak HQ</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* GoPeak HQ: same look as the app. Pure black, brand blue, Inter, depth cards, no glows. */
:root{
  --bg:#000;--card:#141416;--card2:#1c1c20;--line:#26262c;--fg:#fff;--dim:#8e8e98;
  --blue:#137ff9;--blue-hi:#4aadfc;--blue-lo:#0b5fc4;--good:#34c759;--warn:#ffb020;--bad:#ff453a;
  --r:28px;--font:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
@media (min-width:1000px){.wrap{max-width:1040px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.grid2>.card{margin-top:0}}

/* depth card: soft blue fade from the top, black drop shadow */
.card{position:relative;background:linear-gradient(180deg,rgba(19,127,249,.10),rgba(19,127,249,0) 42%),var(--card);border-radius:var(--r);padding:20px;margin-top:14px;box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.card.flat{background:var(--card)}
.label{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.label svg{width:16px;height:16px}
.big{font-weight:900;letter-spacing:-1.5px;line-height:1}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:700}
.chip.blue{background:rgba(19,127,249,.18);color:var(--blue-hi)}
.chip.good{background:rgba(52,199,89,.16);color:var(--good)}
.chip.warn{background:rgba(255,176,32,.16);color:var(--warn)}
.btn3d{height:48px;padding:0 20px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 4px 0 var(--blue-lo);transition:transform .12s,box-shadow .12s}
.btn3d:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-lo)}
.btn3d.ghost{background:var(--card2);box-shadow:0 4px 0 #050506}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.4px}
.brand img{width:30px;height:30px;border-radius:9px}
.live{width:8px;height:8px;border-radius:50%;background:var(--good)}

/* bottom tab bar, floating like the app */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:6px;background:#141416;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;padding:8px 0;border-radius:999px;font-size:11px;font-weight:700;color:var(--dim)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{background:var(--card2);color:#fff}
section.page{display:none;animation:in .35s ease}section.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* goal ring */
.ringbox{display:grid;place-items:center;padding:6px 0 2px}
.ring{position:relative;width:250px;height:250px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid .big{font-size:76px}
.ring .mid small{display:block;font-size:15px;font-weight:700;color:var(--dim);margin-top:6px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card2);border-radius:20px;padding:14px 12px;text-align:center;box-shadow:0 4px 0 #050506}
.stat b{display:block;font-size:24px;font-weight:900;letter-spacing:-.6px}
.stat span{font-size:12px;font-weight:700;color:var(--dim)}

/* forecast */
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 6px}
.stepper button.pm{width:52px;height:52px;border-radius:50%;background:var(--card2);font-size:28px;font-weight:800;box-shadow:0 4px 0 #050506}
.stepper button.pm:active{transform:translateY(3px);box-shadow:0 1px 0 #050506}
.phones{display:flex;gap:6px;min-width:150px;justify-content:center;flex-wrap:wrap}
.phone{width:22px;height:38px;border-radius:7px;background:var(--blue);box-shadow:0 3px 0 var(--blue-lo);position:relative;animation:pop .3s ease}
.phone::after{content:"";position:absolute;left:50%;top:4px;width:8px;height:2px;margin-left:-4px;border-radius:2px;background:rgba(255,255,255,.55)}
.phone.off{background:var(--card2);box-shadow:0 3px 0 #050506}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.fc-out{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:10px}
.fc-out .big{font-size:64px;color:var(--blue-hi)}
.fc-bar{height:14px;border-radius:999px;background:var(--card2);margin-top:16px;position:relative;overflow:hidden}
.fc-bar i{position:absolute;top:0;bottom:0;left:0;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fc-bar i.now{background:#fff}.fc-bar i.add{background:var(--blue)}
.fc-bar .goal{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--good)}
.toggle{display:inline-flex;background:var(--card2);border-radius:999px;padding:4px;gap:4px}
.toggle button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:800;color:var(--dim)}
.toggle button[aria-pressed=true]{background:#fff;color:#000}

/* charts */
.chart{width:100%;height:170px;margin-top:12px}
.chart text{fill:var(--dim);font-size:10px;font-weight:700;font-family:var(--font)}
.funnel{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.fstep{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.fdot{border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 4px 0 var(--blue-lo);color:#fff;font-weight:900}
.fstep span{font-size:12px;font-weight:700;color:var(--dim)}
.farrow{font-size:12px;font-weight:800;color:var(--blue-hi);display:flex;flex-direction:column;align-items:center;gap:2px}
.farrow svg{width:18px;height:18px;opacity:.7}

/* accounts + post grid */
.acc{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;background:var(--blue);box-shadow:0 3px 0 var(--blue-lo);flex:none}
.acc b{font-size:16px;font-weight:800}
.acc small{display:block;font-size:12px;font-weight:700;color:var(--dim)}
.spark{width:96px;height:36px;margin-left:auto}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.post{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1d3d66,#0d1a2c)}
.post img{width:100%;height:100%;object-fit:cover;display:block}
.post .v{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.post .v svg{width:13px;height:13px}
.post .s{position:absolute;right:6px;top:6px;height:22px;padding:0 8px;border-radius:999px;background:rgba(19,127,249,.92);font-size:11px;font-weight:800;display:flex;align-items:center}
.post.best{outline:3px solid var(--blue-hi);outline-offset:-3px}
.empty{padding:26px 10px;text-align:center;color:var(--dim);font-weight:700;font-size:14px}
.empty svg{width:42px;height:42px;display:block;margin:0 auto 10px;opacity:.5}

/* ideas */
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:800;color:var(--dim)}
.filters button[aria-pressed=true]{background:#fff;color:#000}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (min-width:1000px){.ideas{grid-template-columns:repeat(4,1fr)}}
.idea{position:relative;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 8px 20px rgba(0,0,0,.5);text-align:left;display:flex;flex-direction:column}
.idea .art{aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.idea .art svg{width:46%;height:46%}
.idea .mult{position:absolute;left:10px;top:10px;height:28px;padding:0 10px;border-radius:999px;background:#fff;color:#000;font-weight:900;font-size:14px;display:flex;align-items:center}
.idea .plat{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center}
.idea .plat svg{width:15px;height:15px}
.idea .meta{padding:10px 12px 12px}
.idea .meta b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.idea .meta small{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--dim)}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--card2)}.dots i.on{background:var(--blue-hi)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:#0e0e10;border-radius:32px 32px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3a40;margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.beats{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.beat{flex:1;min-width:84px;background:var(--card);border-radius:16px;padding:10px;font-size:12px;font-weight:700;line-height:1.3}
.beat i{display:block;font-style:normal;font-size:11px;color:var(--blue-hi);font-weight:900;margin-bottom:4px}
.shots{margin-top:14px;display:grid;gap:8px}
.shot{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:18px;padding:12px}
.shot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--blue-lo)}
.shot p{font-size:14px;font-weight:600;line-height:1.35;padding-top:5px}
.ost{margin-top:14px;display:grid;place-items:center;aspect-ratio:9/6;border-radius:22px;background:linear-gradient(180deg,#1b3a63,#0b1626);position:relative;overflow:hidden}
.ost span{background:#fff;color:#000;font-weight:800;font-size:17px;padding:8px 12px;border-radius:6px;max-width:80%;text-align:center}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--card);border-radius:16px;padding:10px;text-align:center}
.kv b{display:block;font-size:15px;font-weight:900}.kv span{font-size:11px;font-weight:700;color:var(--dim)}

/* creators */
.crt{display:flex;align-items:center;gap:12px}
.crt .av{background:linear-gradient(180deg,var(--blue-hi),var(--blue))}
.cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.cstats div{background:var(--card2);border-radius:16px;padding:10px 6px;text-align:center}
.cstats b{display:block;font-size:18px;font-weight:900;letter-spacing:-.4px}.cstats span{font-size:11px;font-weight:700;color:var(--dim)}
.link{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--card2);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--blue-hi);overflow:hidden}
.link span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link button{flex:none;height:30px;padding:0 12px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;font-weight:800}
form.cf{display:grid;gap:10px;margin-top:14px}
form.cf input,form.cf select{width:100%;height:50px;border-radius:16px;border:0;background:var(--card);color:#fff;padding:0 14px;font:600 16px var(--font);outline:none}
form.cf input:focus,form.cf select:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* gate */
#gate{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;padding:24px}
#gate .in{width:100%;max-width:340px;text-align:center}
#gate img{width:72px;height:72px;border-radius:20px;box-shadow:0 8px 20px rgba(19,127,249,.25)}
#gate h1{font-size:28px;font-weight:900;letter-spacing:-.6px;margin:18px 0 22px}
#lockRow{display:flex;gap:8px;background:var(--card);border-radius:999px;padding:6px}
#lockRow input{flex:1;min-width:0;background:none;border:0;color:#fff;font:600 17px var(--font);padding:0 14px;outline:none}
#lockRow button{width:46px;height:46px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 3px 0 var(--blue-lo)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;background:#fff;color:#000;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;transition:all .25s}
.toast.on{opacity:1;transform:translateX(-50%)}


.fcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fcbox{background:var(--card2);border-radius:22px;padding:16px;box-shadow:0 4px 0 #050506}
.fcbox span{display:block;font-size:12px;font-weight:800;color:var(--dim)}
.fcbox b{display:block;font-size:46px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin-top:6px;color:var(--blue-hi)}
.fcbox small{font-size:12px;font-weight:700;color:var(--dim)}
.plan{display:flex;align-items:center;gap:14px;margin-top:12px;background:rgba(19,127,249,.14);border-radius:22px;padding:14px 16px}
.plan .phones{min-width:0;justify-content:flex-start;flex:none;max-width:132px}
.plan b{font-size:15px;font-weight:800;line-height:1.3}
.plan small{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-top:2px}
.idea .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.idea .art.has img+svg,.idea .art.has>svg{display:none}
.idea .art.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.35))}
.idea .art .mult,.idea .art .plat,.idea .art .eye,.idea .art .new{z-index:1}
.idea .appr{margin:0 12px 12px;height:40px;border-radius:999px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);box-shadow:0 4px 0 #050506;color:#fff}
.idea .appr.on{background:var(--good);box-shadow:0 4px 0 #1e7a37;color:#04210d}
.idea .appr:active{transform:translateY(3px);box-shadow:0 1px 0 #050506}
.idea .new{position:absolute;left:10px;bottom:10px;height:24px;padding:0 9px;border-radius:999px;background:var(--blue);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center}
.idea .art{aspect-ratio:3/4}
.player{margin:14px auto 0;width:100%;max-width:330px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#0b0b0d}
.player iframe{width:100%;height:100%;border:0;display:block}

.bars{margin-top:14px}
.bars .cols{display:flex;align-items:flex-end;gap:4px;height:170px;border-bottom:1px solid var(--line);position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .col b{font-size:11px;font-weight:800;color:#fff;margin-bottom:4px;white-space:nowrap}
.bars .col i{display:block;width:100%;max-width:22px;border-radius:6px 6px 3px 3px;background:var(--blue);min-height:3px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bars .col.zero i{background:#26262c}.bars .col.zero b{color:var(--dim)}
.bars .col.today i{background:var(--blue-hi)}
.bars .row{display:flex;gap:4px;margin-top:8px}
.bars .row span{flex:1;min-width:0;text-align:center;font-size:10px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden}
.bars .row.posts span{height:22px;display:flex;align-items:center;justify-content:center}
.bars .row.posts em{font-style:normal;display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 5px;border-radius:999px;background:#fff;color:#000;font-size:10px;font-weight:900}
.bars .row.posts em svg{width:9px;height:9px}
.bars .key{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;color:var(--dim)}
.bars .key em{font-style:normal;display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px;border-radius:999px;background:#fff;color:#000;font-size:10px;font-weight:900}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--good);opacity:.7}
.bars .goal span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:800;color:var(--good)}
/* team (boss) */
.boss{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:14px}.boss::-webkit-scrollbar{display:none}
.boss button{flex:none}
.qcard{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.qcard video{width:120px;aspect-ratio:9/16;border-radius:18px;background:#0b0b0d;object-fit:cover}
.qcard .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn3d.sm{height:40px;padding:0 16px;font-size:14px}
.btn3d.good{background:var(--good);box-shadow:0 4px 0 #1e7a37}
.btn3d.bad{background:#2a2a30;box-shadow:0 4px 0 #050506;color:#ff6b62}
.prog{position:relative;width:64px;height:64px;flex:none}
.prog svg{width:100%;height:100%;transform:rotate(-90deg)}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900}
.flag{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.flag:first-of-type{border-top:0}
.flag .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,69,58,.16);color:var(--bad);display:grid;place-items:center;flex:none}
.flag small{display:block;color:var(--dim);font-weight:700;font-size:12px}
.switch{position:relative;width:52px;height:32px;border-radius:999px;background:#2a2a30;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true]{background:var(--good)}.switch[aria-checked=true]::after{transform:translateX(20px)}
.idea .eye{position:absolute;right:10px;bottom:10px;height:24px;padding:0 8px;border-radius:999px;background:var(--good);color:#04210d;font-size:11px;font-weight:900;display:flex;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate"><div class="in">
  <img src="logo.png" alt="">
  <h1>GoPeak HQ</h1>
  <form id="lockRow" autocomplete="off"><input id="pw" type="password" placeholder="password" aria-label="Password" autofocus>

        <span class="label" style="margin-top:3px">${handles.map((h) => `<svg viewBox="0 0 24 24">${PLAT[h[0]] || PLAT.tiktok}</svg>${esc(h[1])}`).join(" ") || "no handles"}</span></div>
        <button class="chip${c.status === "active" ? "" : " warn"}" data-edit="${c.id}">${c.status === "active" ? "edit" : c.status}</button></div>
      <div class="cstats"><div><b>${c.counted}/${c.retainer_videos}</b><span>videos</span></div><div><b>${fmt(c.views)}</b><span>views</span></div><div><b>${c.flagged}</b><span>flagged</span></div><div><b>$${fmt(c.paid_total)}</b><span>paid</span></div></div>
      ${done ? `<button class="btn3d good" style="width:100%;margin-top:14px" data-pay="${c.id}">pay $${fmt(c.retainer_pay)}</button>` : `<div class="fc-bar" style="margin-top:14px"><i class="add" style="width:${Math.min(100, (100 * c.counted) / c.retainer_videos)}%"></i></div>`}</div>`;
  }).join("") || `<div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/></svg>invite your first creator</div></div>`;
  $("#team").querySelectorAll("[data-pay]").forEach((b) => b.onclick = async () => { const c = byId[b.dataset.pay];
    confirmSheet(`pay ${esc(c.name)} $${fmt(c.retainer_pay)}?`, "mark paid", async () => { await cp("admin/payout", { id: c.id }).then((r) => toast(`logged $${r.amount}`)).catch((e) => toast(e.message)); loadTeam(); }); });
  $("#team").querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editCreator(byId[b.dataset.edit]));
  // flagged posts
  $("#flaggedBox").innerHTML = T.flagged.length ? `<div class="card"><span class="label" style="color:var(--bad)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>posted without approval</span>
    ${T.flagged.slice(0, 20).map((p) => `<div class="flag"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24">${PLAT[p.platform] || PLAT.tiktok}</svg></span><div style="flex:1;min-width:0"><b style="font-size:14px">${esc(byId[p.creator_id]?.name || "")}</b><small>${fmt(p.views)} views · ${ago(p.posted_at || p.detected_at)} ago</small></div>
      <a class="chip" href="${esc(p.url)}" target="_blank" rel="noopener">view</a><button class="chip blue" data-count="${p.id}">count it</button></div>`).join("")}</div>` : "";
  $("#flaggedBox").querySelectorAll("[data-count]").forEach((b) => b.onclick = async () => { await cp("admin/post", { id: b.dataset.count, state: "counted" }).catch(() => {}); toast("counted"); loadTeam(); });
  // pending invites
  $("#invitesBox").innerHTML = T.invites.length ? `<div class="card"><span class="label">invites waiting</span>${T.invites.map((i) => `<div class="link"><span>${esc(i.name || i.email)}</span><button data-copy="${esc(i.link)}">copy link</button></div>`).join("")}</div>` : "";
  $("#invitesBox").querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => shareLink(b.dataset.copy));
}
async function shareLink(link) {
  if (navigator.share) { try { await navigator.share({ title: "GoPeak creator invite", url: link }); return; } catch {} }
  try { await navigator.clipboard.writeText(link); toast("link copied"); } catch { toast(link); }
}
function confirmSheet(text, cta, fn) {
  openSheet(`<h3>${text}</h3><div class="row" style="margin-top:18px"><button class="btn3d good" style="flex:1" id="cyes">${cta}</button><button class="btn3d ghost" id="cno">cancel</button></div>`);
  $("#cyes").onclick = async () => { closeSheet(); await fn(); }; $("#cno").onclick = closeSheet;
}
$("#inviteBtn").onclick = () => {
  if (!T || T.error) return toast("needs the one-time setup first");
  openSheet(`<h3>invite a creator</h3><form class="cf" id="inv">
    <input name="name" placeholder="name" maxlength="60" required>
    <input name="email" type="email" placeholder="email" required autocapitalize="off">
    <div class="two"><input name="retainer_videos" type="number" inputmode="numeric" min="1" value="45" aria-label="videos per payout"><input name="retainer_pay" type="number" inputmode="decimal" min="0" value="300" aria-label="dollars per payout"></div>
    <span class="label" style="justify-content:center">videos · $ per payout</span>
    <button class="btn3d">create invite link</button></form>`);
  $("#inv").onsubmit = async (e) => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    try { const r = await cp("admin/invite", v); openSheet(`<h3>invite ready</h3><div class="link" style="margin-top:16px"><span>${esc(r.link.replace("https://", ""))}</span></div><button class="btn3d" style="width:100%;margin-top:14px" id="shareInv">send it</button>`); $("#shareInv").onclick = () => shareLink(r.link); loadTeam(); }
    catch (err) { toast(err.message); }
  };
};
function editCreator(c) {
  openSheet(`<h3>${esc(c.name)}</h3><form class="cf" id="ec">
    <div class="two"><input name="retainer_videos" type="number" min="1" value="${c.retainer_videos}" aria-label="videos per payout"><input name="retainer_pay" type="number" min="0" value="${c.retainer_pay}" aria-label="dollars per payout"></div>
    <input name="tiktok" placeholder="tiktok" value="${esc(c.tiktok || "")}"><input name="instagram" placeholder="instagram" value="${esc(c.instagram || "")}"><input name="youtube" placeholder="youtube" value="${esc(c.youtube || "")}">
    <select name="status">${["active", "paused", "removed"].map((x) => `<option ${x === c.status ? "selected" : ""}>${x}</option>`).join("")}</select>
    <button class="btn3d">save</button>${c.counted ? `<button type="button" class="btn3d ghost" id="payPart">pay early (${c.counted} videos)</button>` : ""}</form>`);
  $("#ec").onsubmit = async (e) => { e.preventDefault(); await cp("admin/creator", { id: c.id, ...Object.fromEntries(new FormData(e.target)) }).then(() => toast("saved")).catch(() => toast("couldn't save")); closeSheet(); loadTeam(); };
  if ($("#payPart")) $("#payPart").onclick = () => confirmSheet(`pay ${esc(c.name)} for ${c.counted} videos?`, "mark paid", async () => { await cp("admin/payout", { id: c.id, force: true }).then((r) => toast(`logged $${r.amount}`)).catch((e) => toast(e.message)); loadTeam(); });
}
</script>
</body>
</html>
